data:
  openml_id: 1597 # dataset "creditcard" sur OpenML (Credit Card Fraud Detection)
  raw_path: "data/raw.csv"
  target: "Class"
  test_size: 0.2
  random_state: 42

features:
  # Toutes les colonnes sont numeriques (V1-V28 = composantes PCA, + Amount)
  numeric: ["V1", "V2", "V3", "V4", "V5", "V6", "V7", "V8", "V9", "V10",
            "V11", "V12", "V13", "V14", "V15", "V16", "V17", "V18", "V19", "V20",
            "V21", "V22", "V23", "V24", "V25", "V26", "V27", "V28", "Amount"]
  categorical: []

model:
  type: "random_forest" # "logreg" ou "random_forest"
  params:
    logreg:
      C: [0.1, 1.0, 10.0]
      class_weight: ["balanced"]
    random_forest:
      n_estimators: [100, 200]
      max_depth: [10, 20]
      class_weight: ["balanced"]

cv:
  strategy: "StratifiedKFold"
  n_splits: 5
  scoring: "average_precision" # adapte au fort desequilibre de classes (0.17% de fraude)

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "credit-card-fraud"
  registered_model_name: "CreditCardFraudClassifier"
  promote_stage: "Production"
